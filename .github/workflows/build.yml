name: Build Steady APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write   # needed to publish the APK as a GitHub Release

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      # Build the APK first so a failing unit test can never block you from getting the app.
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Unit tests
        continue-on-error: true
        run: gradle testDebugUnitTest --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Steady.apk

      - uses: actions/upload-artifact@v4
        with:
          name: steady-apk
          path: Steady.apk
          if-no-files-found: error

      # Direct-download link (no zip, no GitHub login needed on the phone if the repo is public).
      - name: Publish APK to the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest Steady.apk \
            --title "Steady (latest build)" \
            --notes "Debug APK built from commit ${GITHUB_SHA::7}. Download Steady.apk and install it." \
            --target "$GITHUB_SHA"
